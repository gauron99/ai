<!doctype html>
<!--
  Skeleton for a visualize diagram.

  Two ways to draw. KEEP ONE, DELETE THE OTHER, in both the <style> and the <body>:
    A - CSS boxes.  Sequences and shallow trees. Text selects and reflows, and the
                    row becomes a column on a narrow screen.
    B - inline SVG. Edges that cross, branch, loop, or skip nodes. You place
                    everything, so you can draw anything.

  Everything outside the marked A/B blocks is shared. Keep it as is.

  The LIVE RELOAD block at the end keeps an open tab current while you iterate.
  Delete it before you hand the file to anyone.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipeline overview</title>
<style>
  :root{
    --bg:#1e1f29; --node:#282a36; --line:#6272a4; --ink:#f8f8f2;
    --arrow:#8895b3; --muted:#b0b8d1;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);}
  .page{max-width:1000px;margin:0 auto;padding:32px 24px 48px;}
  h1{font-size:20px;font-weight:600;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--muted);margin:0 0 32px;}

  /* ===== A: CSS boxes ===== */
  .flow{display:flex;flex-wrap:wrap;align-items:center;}
  .node{background:var(--node);border:1px solid var(--line);border-radius:8px;
        padding:14px 18px;font-size:15px;}
  /* The label sits IN FLOW so it sets the connector's width, then rides up off
     the line. An absolutely positioned label contributes no width and its text
     overruns the next node. */
  .edge{position:relative;flex:0 0 auto;min-width:72px;padding:0 16px;
        display:flex;align-items:center;justify-content:center;}
  .lbl{position:relative;top:-11px;white-space:nowrap;
        font-size:12.5px;color:var(--muted);}
  .ln{position:absolute;left:0;right:0;top:50%;margin-top:-1px;
        height:2px;background:var(--arrow);}
  .ln::after{content:"";position:absolute;right:0;top:-4px;
        border-left:8px solid var(--arrow);
        border-top:5px solid transparent;border-bottom:5px solid transparent;}
  @media(max-width:560px){
    .flow{flex-direction:column;align-items:flex-start;}
    .edge{display:block;min-width:0;height:52px;margin-left:26px;padding:0;}
    .lbl{position:absolute;left:14px;top:50%;transform:translateY(-50%);}
    .ln{left:0;right:auto;top:0;bottom:0;width:2px;height:auto;margin-top:0;}
    .ln::after{right:auto;left:-4px;top:auto;bottom:0;border:none;
          border-top:8px solid var(--arrow);
          border-left:5px solid transparent;border-right:5px solid transparent;}
  }

  /* ===== B: inline SVG ===== */
  .figure{width:100%;overflow-x:auto;}
  svg{width:100%;height:auto;display:block;}
  .n{fill:var(--node);stroke:var(--line);stroke-width:1.5;rx:8;}
  .nl{fill:var(--ink);font-size:15px;text-anchor:middle;dominant-baseline:middle;}
  .e{stroke:var(--arrow);stroke-width:2;fill:none;}
  .el{fill:var(--muted);font-size:12.5px;text-anchor:middle;}
  /* A CSS class, not fill="var(--arrow)": var() does not resolve in a
     presentation attribute, so the arrowheads would render black and vanish. */
  .ah{fill:var(--arrow);}
</style>
</head>
<body>
<div class="page">
  <h1>Pipeline overview</h1>
  <p class="sub">generated by visualize</p>

  <!-- ===== A: CSS boxes ===== -->
  <div class="flow">
    <div class="node">CLI input</div>
    <div class="edge"><i class="ln"></i><span class="lbl">source file</span></div>
    <div class="node">Pipeline</div>
    <div class="edge"><i class="ln"></i><span class="lbl">transformed</span></div>
    <div class="node">Output</div>
  </div>

  <!-- ===== B: inline SVG ===== -->
  <div class="figure">
    <svg viewBox="0 0 722 120" role="img" aria-label="CLI input to pipeline to output">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path class="ah" d="M0,0 L10,5 L0,10 z"/>
        </marker>
      </defs>

      <!-- Gaps between nodes are 120px so an edge label fits inside one.
           Narrow the gap and the label overruns the neighbouring box. -->
      <rect class="n" x="16"  y="34" width="150" height="52"/>
      <text class="nl" x="91"  y="60">CLI input</text>

      <rect class="n" x="286" y="34" width="150" height="52"/>
      <text class="nl" x="361" y="60">Pipeline</text>

      <rect class="n" x="556" y="34" width="150" height="52"/>
      <text class="nl" x="631" y="60">Output</text>

      <path class="e" d="M166,60 L280,60" marker-end="url(#arrow)"/>
      <text class="el" x="223" y="50">source file</text>

      <path class="e" d="M436,60 L550,60" marker-end="url(#arrow)"/>
      <text class="el" x="493" y="50">transformed</text>
    </svg>
  </div>
</div>

<!-- ===== LIVE RELOAD - delete this block to freeze the file =====
     file:// forbids fetch() and XHR against a sibling file, so the page cannot
     read its own source and diff it. Reloading IS the read: rewrite this file
     and the open tab shows the new diagram on the next tick.

     Costs, stated plainly: the page reloads whether or not anything changed,
     and each reload repaints. Raise MS if the flicker bothers you more than
     the lag does. -->
<script>
(() => {
  const MS = 2000;

  // A reload lands you back at the top of a tall diagram. Carry the position.
  addEventListener('beforeunload', () => sessionStorage.setItem('vz-y', scrollY));
  const y = sessionStorage.getItem('vz-y');
  if (y) scrollTo(0, +y);

  // A hidden tab reloads nothing: no repaint you cannot see, no disk read.
  const tick = () => {
    if (document.visibilityState === 'visible') location.reload();
    else setTimeout(tick, MS);
  };
  setTimeout(tick, MS);
})();
</script>
</body>
</html>
